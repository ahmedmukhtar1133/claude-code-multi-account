<!doctype html>
<html><head><meta charset="utf-8"><title>Shared history scene</title>
<style>
/* Two code-drawn VS Code windows, Personal and Work, for the README GIF "one shared history". render(t) draws frame t (seconds). */
:root { --bg:#1F1F1F; --side:#181818; --line:#2B2B2B; --fg:#CCCCCC; --mut:#9D9D9D; --blue:#0078D4; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; background: #0E0E0E; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; color: var(--fg); }
.win { position: absolute; top: 14px; width: 586px; height: 692px; background: var(--bg); display: grid; grid-template-rows: 28px 1fr 22px; overflow: hidden; border: 1px solid #333; border-radius: 8px; }
#L { left: 10px; } #R { left: 604px; }
.title { background: var(--side); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; gap: 7px; }
.tl { width: 11px; height: 11px; border-radius: 50%; }
.title .t { flex: 1; text-align: center; color: var(--mut); font-size: 12px; margin-right: 46px; }
.mid { display: grid; grid-template-columns: 266px 1fr; min-height: 0; }
.sidebar { background: var(--side); border-right: 1px solid var(--line); position: relative; }
.sidebar iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.chat { background: var(--side); display: grid; grid-template-rows: 32px 1fr auto; min-width: 0; }
.chat .head { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--line); color: #FFFFFF; }
.chat .head .who { color: var(--mut); font-size: 12px; }
.msgs { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.bubble { align-self: flex-end; background: #2B2B2B; border-radius: 10px; padding: 7px 11px; max-width: 90%; }
.reply { line-height: 1.5; }
.reply .mut { color: var(--mut); }
.input { margin: 10px; border: 1px solid #3C3C3C; border-radius: 8px; padding: 9px 11px; color: #6E7681; min-height: 38px; }
.input.focus { border-color: var(--blue); color: #E0E0E0; }
.caret { display: inline-block; width: 1px; height: 15px; background: #E0E0E0; vertical-align: -3px; margin-left: 1px; }
.status { background: var(--side); border-top: 1px solid var(--line); display: flex; align-items: center; padding: 0 8px; font-size: 12px; gap: 6px; }
.status svg { width: 14px; height: 14px; }
.hide { display: none; }
.cursor { position: absolute; width: 22px; height: 22px; left: 0; top: 0; z-index: 10; }
.ring { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #FFFFFF; opacity: 0; z-index: 9; }
.glow { position: absolute; left: 616px; top: 0; width: 254px; height: 32px; border: 2px solid #D97757; border-radius: 6px; opacity: 0; z-index: 8; }
.cap { position: absolute; left: 0; top: 720px; width: 1200px; height: 80px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 22px; color: #F4F3EE; }
.cap .num { width: 30px; height: 30px; border-radius: 50%; background: #D97757; color: #FFFFFF; font-weight: 700; font-size: 16px; display: grid; place-items: center; }
</style></head>
<body>
<div class="win" id="L">
  <div class="title"><span class="tl" style="background:#FF5F57"></span><span class="tl" style="background:#FEBC2E"></span><span class="tl" style="background:#28C840"></span><span class="t">checkout-service</span></div>
  <div class="mid">
    <div class="sidebar"><iframe id="lBefore" src="build/panel-personal.html"></iframe><iframe id="lAfter" src="build/panel-personal-after.html" style="visibility:hidden"></iframe></div>
    <div class="chat"><div class="head"><span>Claude Code</span><span class="who">you@personal.dev</span></div>
      <div class="msgs"><div class="bubble hide" id="lBubble">Rename the payment webhook handler</div>
        <div class="reply hide" id="lReply">Renamed it to <span class="mut">handleStripeEvent</span> and updated the 3 places that call it.</div></div>
      <div class="input" id="lInput">Ask Claude to edit your code…</div></div>
  </div>
  <div class="status"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/></svg>Personal</div>
</div>
<div class="win" id="R">
  <div class="title"><span class="tl" style="background:#FF5F57"></span><span class="tl" style="background:#FEBC2E"></span><span class="tl" style="background:#28C840"></span><span class="t">checkout-service</span></div>
  <div class="mid">
    <div class="sidebar"><iframe id="rBefore" src="build/panel-work.html"></iframe><iframe id="rAfter" src="build/panel-work-after.html" style="visibility:hidden"></iframe></div>
    <div class="chat"><div class="head"><span>Claude Code</span><span class="who">you@company.com</span></div>
      <div class="msgs"></div>
      <div class="input">Ask Claude to edit your code…</div></div>
  </div>
  <div class="status"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/></svg>Work</div>
</div>
<div class="glow" id="glow"></div>
<div class="ring" id="ring"></div>
<svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.5-7L4 19z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/></svg>
<div class="cap"><span class="num" id="capn">1</span><span id="capt"></span></div>
<script>
const $ = (id) => document.getElementById(id);
const prompt = 'Rename the payment webhook handler';
const path = [[0, 600, 400], [0.8, 600, 400], [1.6, 420, 668], [4.6, 420, 668], [5.8, 760, 0], [11, 760, 0]];
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
function at(t) {
  for (let i = 1; i < path.length; i++) {
    const [t1, x1, y1] = path[i], [t0, x0, y0] = path[i - 1];
    if (t <= t1) { const k = t1 === t0 ? 1 : ease((t - t0) / (t1 - t0)); return [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k]; }
  }
  const l = path[path.length - 1]; return [l[1], l[2]];
}
// The first session row of the Work panel, measured once the iframe has loaded.
let rowY = 330;
window.addEventListener('load', () => {
  const doc = $('rAfter').contentDocument;
  const row = doc && doc.querySelector('.srow');
  if (row) rowY = 14 + 28 + row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
  path[4][2] = rowY; path[5][2] = rowY;
  $('glow').style.top = (rowY - 16) + 'px';
});
const caps = [[0, 1, 'Personal on the left, Work on the right'], [1.6, 2, 'Start a session in the Personal window'], [4.4, 3, 'It shows up in the Work window too']];
window.render = (t) => {
  const [x, y] = at(t);
  $('cursor').style.transform = `translate(${x - 4}px, ${y - 2}px)`;
  const c = [1.7].find((c) => t >= c && t < c + 0.35);
  $('ring').style.opacity = c !== undefined ? String(1 - (t - c) / 0.35) : '0';
  $('ring').style.transform = `translate(${x - 15}px, ${y - 15}px) scale(${c !== undefined ? 0.6 + (t - c) * 1.6 : 1})`;
  const typing = t >= 1.9 && t < 3.8;
  const n = Math.min(prompt.length, Math.max(0, Math.floor((t - 1.9) / 1.7 * prompt.length)));
  const inp = $('lInput');
  inp.classList.toggle('focus', t >= 1.7 && t < 3.8);
  inp.innerHTML = t >= 1.7 && t < 3.8 ? (prompt.slice(0, n) + (Math.floor(t * 3) % 2 === 0 || typing ? '<span class="caret"></span>' : '')) : 'Ask Claude to edit your code…';
  $('lBubble').classList.toggle('hide', t < 3.8);
  $('lReply').classList.toggle('hide', t < 4.3);
  const done = t >= 4.4;
  $('lBefore').style.visibility = done ? 'hidden' : 'visible';
  $('lAfter').style.visibility = done ? 'visible' : 'hidden';
  $('rBefore').style.visibility = done ? 'hidden' : 'visible';
  $('rAfter').style.visibility = done ? 'visible' : 'hidden';
  $('glow').style.opacity = t >= 5.8 ? String(Math.min(1, (t - 5.8) / 0.3)) : '0';
  const cap = [...caps].reverse().find((k) => t >= k[0]);
  $('capn').textContent = cap[1];
  $('capt').textContent = cap[2];
};
render(0);
</script>
</body></html>
